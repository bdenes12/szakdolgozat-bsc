services:
  admin_db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${ADMIN_DB_USER}
      POSTGRES_PASSWORD: ${ADMIN_DB_PASSWORD}
      POSTGRES_DB: ${ADMIN_DB_NAME}
    ports:
      - "5438:5432"
    volumes:
      - admin_db_data:/var/lib/postgresql/data
    networks:
      - net_admin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ADMIN_DB_USER} -d ${ADMIN_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  prod_db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${PROD_DB}
    ports:
      - "5437:5432"
    volumes:
      - prod_db_data:/var/lib/postgresql/data
      - ./sql/production:/docker-entrypoint-initdb.d
    networks:
      - net_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${PROD_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  staging_db:
    image: registry.gitlab.com/dalibo/postgresql_anonymizer:3.0.5
    command: ["postgres", "-c", "shared_preload_libraries=anon", "-c", "anon.masking_policies=support,analytics"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${STAGING_DB}
      STAGING_SUPPORT_USER: ${STAGING_SUPPORT_USER}
      STAGING_SUPPORT_PASSWORD: ${STAGING_SUPPORT_PASSWORD}
      STAGING_ANALYST_USER: ${STAGING_ANALYST_USER}
      STAGING_ANALYST_PASSWORD: ${STAGING_ANALYST_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - staging_db_data:/var/lib/postgresql/data
      - ./sql/staging:/docker-entrypoint-initdb.d
    networks:
      - net_staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${STAGING_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dev_db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DEV_DB}
    ports:
      - "5436:5432"
    volumes:
      - dev_db_data:/var/lib/postgresql/data
    networks:
      - net_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DEV_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_DB_NAME: ${ADMIN_DB_NAME}
      ADMIN_DB_USER: ${ADMIN_DB_USER}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD}
      ADMIN_DB_HOST: admin_db
      ADMIN_DB_PORT: "5432"
      PRODUCTION_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@prod_db:5432/${PROD_DB}
      STAGING_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@staging_db:5432/${STAGING_DB}
      DEV_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@dev_db:5432/${DEV_DB}
      STAGING_ANALYST_DSN: postgresql://${STAGING_ANALYST_USER}:${STAGING_ANALYST_PASSWORD}@staging_db:5432/${STAGING_DB}
    depends_on:
      prod_db:
        condition: service_healthy
      staging_db:
        condition: service_healthy
      dev_db:
        condition: service_healthy
      admin_db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - .:/app
    networks:
    - net_prod
    - net_staging
    - net_dev
    - net_admin
    command: >
      sh -c "python manage.py migrate &&
            python manage.py runserver 0.0.0.0:8000 --noreload"

volumes:
  staging_db_data:
  dev_db_data:
  admin_db_data:
  prod_db_data:

networks:
  net_prod:
    driver: bridge
  net_staging:
    driver: bridge
  net_dev:
    driver: bridge
  net_admin:
    driver: bridge